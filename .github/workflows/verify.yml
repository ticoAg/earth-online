name: Rule engine verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install development dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, unit tests, synthetic simulation
        run: npm run verify
      - name: SQLite synthetic fixtures and persistent replay smoke test
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:demo
          npm run db:demo
